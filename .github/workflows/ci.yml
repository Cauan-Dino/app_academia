name: Validacao do projeto

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (Python)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    defaults:
      run:
        working-directory: app_academia_back/app_academia/src/back_end

    steps:
      - name: Baixar o codigo
        uses: actions/checkout@v6

      - name: Configurar Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Instalar Poetry
        run: python -m pip install --disable-pip-version-check poetry

      - name: Validar pyproject.toml e poetry.lock
        run: poetry check --lock

      - name: Instalar dependencias
        run: poetry install --no-root --no-interaction --no-ansi

      - name: Verificar sintaxe do Python
        run: >-
          poetry run python -m compileall -q
          auth core routers schemas services main.py

      - name: Executar testes quando existirem
        shell: bash
        run: |
          if find ../../tests -type f \( -name 'test_*.py' -o -name '*_test.py' \) -print -quit | grep -q .; then
            poetry run pytest ../../tests
          else
            echo "Nenhum teste foi encontrado em app_academia/tests."
          fi

  frontend:
    name: Frontend (Expo)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CI: "true"

    defaults:
      run:
        working-directory: front_end

    steps:
      - name: Baixar o codigo
        uses: actions/checkout@v6

      - name: Configurar Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: front_end/package-lock.json

      - name: Instalar dependencias
        run: npm ci

      - name: Executar ESLint quando estiver configurado
        shell: bash
        run: |
          if compgen -G 'eslint.config.*' > /dev/null || compgen -G '.eslintrc*' > /dev/null; then
            npm run lint
          else
            echo "ESLint ignorado: ainda nao existe um arquivo de configuracao."
          fi

      - name: Validar build web do Expo
        run: npx expo export --platform web --output-dir dist-ci --clear
