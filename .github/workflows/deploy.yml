name: CI/CD Pipeline - Deploy PokeAPI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:
  
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app_academia_back
    steps:
      - name: Copiar o repositorio
        uses: actions/checkout@v5
  
      - name: Criar .env Temporario
        run: |
          echo "REDIS_HOST=redis" > .env
          echo "REDIS_PORT=6379" >> .env
          echo "ES_HOST=elasticsearch" >> .env
          echo "KIBANA_PORT=5601" >> .env
          echo "ES_PORT=9200" >> .env
          echo "SQLALCHEMY_DATABASE_URL=mysql+aiomysql://root:senha_teste@mysql:3306/banco_temporario" >> .env
          echo "MYSQL_ROOT_PASSWORD=senha_teste" >> .env
          echo "MYSQL_DATABASE=banco_temporario" >> .env
          echo "WHATSAPP_VERIFY_TOKEN=token_falso" >> .env
          echo "WHATSAPP_APP_SECRET=app_secreto" >> .env
          echo "WHATSAPP_ACCESS_TOKEN=acess_token_falso" >> .env
          echo "PHONE_NUMBER_ID=123" >> .env
          echo "REDIS_PASSWORD=senha_falsa" >> .env
          echo "SECRET_KEY=ksoadwpaskopdasdkopaksopdawpowdkpoawskpdokopas" >> .env
          echo "TEMPO_REFRESH_TOKEN=30" >> .env
          echo "TEMPO_ACCESS_TOKEN=30" >> .env
          echo "PEPPER=sdijuosajiodijoasdjioasjiosd" >> .env
  
      - name: Criar e subir container de teste
        run: |
          docker compose up --build -d app
          sleep 10
          docker compose logs
  
      - name: Verificar se o container ainda está de pé via endpoint /health
        run: curl --fail --retry 5 --retry-delay 3 --retry-connrefused http://localhost:8000/health
  
      - name: Exibir falhas (se falhar)
        if: failure()
        run: docker compose logs
  
      - name: Matar o container
        if: always()
        run: docker compose down
      
