input {
    file {
        path => "/logs/app.log"
        start_position => "end"
    }
}

filter {
    json {
        source => "message"
    }

    date {
        match => [ "timestamp", "yyyy-MM-dd HH:mm:ss" ]
        target => "@timestamp"
    }
}

output {
    elasticsearch {
        hosts => ["http://elasticsearch:9200"]
        # Um índice por dia: a política de retenção (elasticsearch/configurar_retencao.sh)
        # apaga os índices com mais de 30 dias.
        index => "app-academia-logs-%{+YYYY.MM.dd}"
    }

    # Sem saída stdout: imprimir cada evento duplicava os logs no disco
    # (o Docker guarda tudo que o container imprime).
}