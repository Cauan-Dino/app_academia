[project]
name = "back_end"
version = "0.1.0"
description = "Backend do ecossistema App Academia"
authors = [
    {name = "Cauan Penha"}
]
readme = "README.md"
requires-python = ">=3.13,<4.0" 
dependencies = [
    "fastapi[standard] (>=0.135.2,<0.136.0)",
    "uvicorn (>=0.42.0,<0.43.0)",
    "sqlalchemy (>=2.0.48,<3.0.0)",
    "python-dotenv (>=1.2.2,<2.0.0)",
    "authlib[starlette] (>=1.6.9,<2.0.0)",
    "pyjwt (>=2.12.1,<3.0.0)",
    "cryptography (>=46.0.5,<47.0.0)",
    "redis (>=7.4.0,<8.0.0)",
    "pydantic[email] (>=2.12.5,<3.0.0)",
    "python-multipart (>=0.0.22,<0.0.23)",
    "asyncio (>=4.0.0,<5.0.0)",
    "email-validator (>=2.3.0,<3.0.0)",
    "python-jose (>=3.5.0,<4.0.0)",
    "argon2-cffi (>=25.1.0,<26.0.0)",
    "pytest (>=9.0.3,<10.0.0)",
    "pytest-cov (>=7.1.0,<8.0.0)",
    "aiosqlite (>=0.22.1,<0.23.0)",
    "pymysql (>=1.2.0,<2.0.0)",
    "itsdangerous (>=2.2.0,<3.0.0)",
    "fastapi-mail (<1.5.0)",
    "httpx2 (>=2.9.1,<3.0.0)",
    "elasticsearch (>=9.4.1,<10.0.0)",
    "celery (>=5.6.3,<6.0.0)",
    "requests (>=2.34.2,<3.0.0)",
    "aiohttp (>=3.14.3,<4.0.0)",
    "python-json-logger (>=4.1.0,<5.0.0)",
]

[tool.poetry]
packages = [{include = "backend", from = "src"}]  # Atualizado para apontar para a sua pasta 'backend' renomeada

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"